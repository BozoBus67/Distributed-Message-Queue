global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: task_queue_server
    static_configs:
      - targets: ["localhost:8080"]

  - job_name: task_queue_worker
    static_configs:
      - targets: ["localhost:8081"]
